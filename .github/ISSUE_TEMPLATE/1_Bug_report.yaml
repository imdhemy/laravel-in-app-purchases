name: Bug report
description: Report behavior that does not work as expected.
labels: ["needs triage"]

body:
  - type: markdown
    attributes:
      value: |
        Be concise and factual. Describe the problem and expected outcome without repeating context.
        Include relevant code and errors as text. Distinguish observed results from assumptions,
        and state which checks were actually run. Make the issue understandable without access
        to prior conversations. Redact credentials, purchase tokens, and personal data.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Include the installed LIAP, PHP, and Laravel versions. Add the provider and sandbox
        or production environment when relevant.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Current and expected behavior
      description: Describe what happens and what you expected instead. Include the exact error when relevant.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: |
        Include the smallest relevant code or redacted payload and the steps or command
        needed to reproduce the problem. If you cannot provide or verify a reproduction,
        explain what you tried and what remains unverified.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Supporting evidence
      description: If useful, include relevant logs, verified investigation, or links to documentation and related issues.
